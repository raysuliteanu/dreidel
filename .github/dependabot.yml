version: 2
updates:
  # Keep GitHub Actions pinned to commit SHAs and updated automatically.
  # Dependabot will open PRs to update action SHAs when new versions are tagged.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # release.yml is generated by cargo-dist (`dist generate --mode ci`), which
    # refuses to release if the file was edited; its action versions move only
    # with dist upgrades.
    exclude-paths:
      - ".github/workflows/release.yml"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # MSRV version is set intentionally in ci.yml; @stable refs are not pinned.
      - dependency-name: dtolnay/rust-toolchain
